        <animate attributeName="r" values="3; 7; 3" dur="3.1s" begin="2.8s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.1; 0.4; 0.1" dur="3.1s" begin="2.8s" repeatCount="indefinite" />
