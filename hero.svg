<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FFD1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="1" />
    </radialGradient>
    
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="100%" height="100%" rx="12" fill="#0D1117" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
  <rect width="100%" height="100%" rx="12" fill="url(#grid)" />
  <rect width="100%" height="100%" rx="12" fill="url(#bgGlow)" />

  <g stroke="#1BA0D7" stroke-width="1.5" fill="none">
    <path d="M50 100 Q 150 20, 300 70 T 750 120" stroke-dasharray="6 4" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="60" to="0" dur="4s" repeatCount="indefinite" />
    </path>
    <path d="M100 160 Q 300 200, 500 120 T 720 40" stroke-dasharray="6 4" opacity="0.4">
      <animate attributeName="stroke-dashoffset" from="60" to="0" dur="5s" repeatCount="indefinite" />
    </path>
    <path d="M200 40 Q 400 0, 600 60 T 780 180" stroke-dasharray="6 4" opacity="0.5">
      <animate attributeName="stroke-dashoffset" from="60" to="0" dur="3.5s" repeatCount="indefinite" />
    </path>
  </g>

  <g fill="#00FFD1">
    
    <g>
      <circle cx="50" cy="100" r="5" opacity="0.2">
        <animate attributeName="r" values="3; 8; 3" dur="2.5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.1; 0.4; 0.1" dur="2.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="50" cy="100" r="2"><animate attributeName="r" values="1.5; 3; 1.5" dur="2.5s" repeatCount="indefinite" /></circle>
    </g>

    <g>
      <circle cx="150" cy="20" r="5" opacity="0.2">
        <animate attributeName="r" values="3; 7; 3" dur="3s" begin="1.2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.1; 0.3; 0.1" dur="3s" begin="1.2s" repeatCount="indefinite" />
      </circle>
      <circle cx="150" cy="20" r="2"><animate attributeName="r" values="1.5; 3; 1.5" dur="3s" begin="1.2s" repeatCount="indefinite" /></circle>
    </g>

    <g>
      <circle cx="300" cy="70" r="5" opacity="0.2">
        <animate attributeName="r" values="3.5; 9; 3.5" dur="2.2s" begin="0.5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.15; 0.5; 0.15" dur="2.2s" begin="0.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="300" cy="70" r="2.5"><animate attributeName="r" values="2; 3.5; 2" dur="2.2s" begin="0.5s" repeatCount="indefinite" /></circle>
    </g>

    <g>
      <circle cx="750" cy="120" r="5" opacity="0.2">
