<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FFD1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="1" />
    </radialGradient>
    
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
    </pattern>

    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" rx="12" fill="#0D1117" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />

  <g opacity="0.8">
    <rect width="120%" height="120%" x="-10%" y="-10%" fill="url(#grid)">
      <animateTransform attributeName="transform" type="translate" values="0,0; -40,-40" dur="15s" repeatCount="indefinite" />
    </rect>
  </g>

  <rect width="100%" height="100%" rx="12" fill="url(#bgGlow)" />

  <g stroke="#1BA0D7" stroke-width="1.5" fill="none">
    <path d="M50 100 Q 150 20, 300 70 T 750 120" stroke-dasharray="6 4" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="60" to="0" dur="4s" repeatCount="indefinite" />
    </path>
    <path d="M100 160 Q 300 200, 500 120 T 720 40" stroke-dasharray="6 4" opacity="0.4">
      <animate attributeName="stroke-dashoffset" from="60" to="0" dur="5s" repeatCount="indefinite" />
    </path>
    <path d="M200 40 Q 400 0, 600 60 T 780 180" stroke-dasharray="6 4" opacity="0.5">
      <animate attributeName="stroke-dashoffset" from="60" to="0" dur="3.5s" repeatCount="indefinite" />
    </path>
  </g>

  <g filter="url(#neonGlow)" fill="#00FFD1">
    <circle cx="50" cy="100" r="2">
      <animate attributeName="r" values="1.5; 4.5; 1.5" keyTimes="0; 0.5; 1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" calcMode="spline" dur="2.5s" begin="0s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4; 1; 0.4" dur="2.5s" begin="0s" repeatCount="indefinite" />
    </circle>
    <circle cx="150" cy="20" r="2">
      <animate attributeName="r" values="1.5; 4; 1.5" keyTimes="0; 0.5; 1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" calcMode="spline" dur="3s" begin="1.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3; 0.9; 0.3" dur="3s" begin="1.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="300" cy="70" r="2">
      <animate attributeName="r" values="2; 5; 2" keyTimes="0; 0.5; 1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" calcMode="spline" dur="2.2s" begin="0.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5; 1; 0.5" dur="2.2s" begin="0.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="750" cy="120" r="2">
      <animate attributeName="r" values="1.5; 4; 1.5" keyTimes="0; 0.5; 1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" calcMode="spline" dur="2.8s" begin="2.1s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4; 0.8; 0.4" dur="2.8s" begin="2.1s" repeatCount="indefinite" />
    </circle>
    
    <circle cx="100" cy="160" r="2">
      <animate attributeName="r" values="1.5; 3.5; 1.5" keyTimes="0; 0.5; 1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" calcMode="spline" dur="3s" begin="0.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3; 1; 0.3" dur="3s" begin="0.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="300" cy="200" r="2">
      <animate attributeName="r" values="1.5; 4.5; 1.5" keyTimes="0; 0.5; 1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" calcMode="spline" dur="2.6s" begin="1.7s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5; 1; 0.5" dur="2.6s" begin="1.7s" repeatCount="indefinite" />
    </circle>
    <circle cx="500" cy="120" r="2">
      <animate attributeName="r" values="1.5; 4; 1.5" keyTimes="0; 0.5; 1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" calcMode="spline" dur="2.4s" begin="0.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4; 0.9; 0.4" dur="2.4s" begin="0.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="720" cy="40" r="2">
      <animate attributeName="r" values="2; 5; 2" keyTimes="0; 0.5; 1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" calcMode="spline" dur="2.7s" begin="1.9s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6; 1; 0.6" dur="2.7s" begin="1.9s" repeatCount="indefinite" />
    </circle>

    <circle cx="200" cy="40" r="2">
      <animate attributeName="r" values="1.5; 4; 1.5" keyTimes="0; 0.5; 1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" calcMode="spline" dur="2.9s" begin="2.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4; 1; 0.4" dur="2.9s" begin="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="400" cy="0" r="2">
      <animate attributeName="r" values="1.5; 4; 1.5" keyTimes="0; 0.5; 1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" calcMode="spline" dur="2.3s" begin="1.1s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3; 0.8; 0.3" dur="2.3s" begin="1.1s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="60" r="2">
      <animate attributeName="r" values="2; 4.5; 2" keyTimes="0; 0.5; 1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" calcMode="spline" dur="2.5s" begin="0.3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5; 1; 0.5" dur="2.5s" begin="0.3s" repeatCount="indefinite" />
    </circle>
    <circle cx="780" cy="180" r="2">
      <animate attributeName="r" values="1.5; 4; 1.5" keyTimes="0; 0.5; 1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" calcMode="spline" dur="3.1s" begin="2.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4; 0.9; 0.4" dur="3.1s" begin="2.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <text x="400" y="90" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="34px" fill="#ffffff" letter-spacing="2px">ABDALLAH ABIDA</text>
  <text x="400" y="125" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-weight="600" font-size="15px" fill="#00FFD1" letter-spacing="1px">Chief Technology Officer &amp; AI-Native Architect</text>
  <text x="400" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="12px" fill="#8b949e" letter-spacing="0.5px">Architecting Zero-Trust Intelligence &amp; High-Performance Ecosystems</text>
</svg>
