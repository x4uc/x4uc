        <animate attributeName="opacity" values="0.2; 0.6; 0.2" dur="2.7s" begin="1.9s" repeatCount="indefinite" />
      </circle>
      <circle cx="720" cy="40" r="2.5"><animate attributeName="r" values="2; 4; 2" dur="2.7s" begin="1.9s" repeatCount="indefinite" /></circle>
    </g>

    <g>
      <circle cx="200" cy="40" r="5" opacity="0.2">
        <animate attributeName="r" values="3; 7; 3" dur="2.9s" begin="2.5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.1; 0.4; 0.1" dur="2.9s" begin="2.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="200" cy="40" r="2"><animate attributeName="r" values="1.5; 3; 1.5" dur="2.9s" begin="2.5s" repeatCount="indefinite" /></circle>
    </g>

