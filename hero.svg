      </circle>
      <circle cx="750" cy="120" r="2"><animate attributeName="r" values="1.5; 3; 1.5" dur="2.8s" begin="2.1s" repeatCount="indefinite" /></circle>
    </g>

    <g>
      <circle cx="100" cy="160" r="5" opacity="0.2">
