      <circle cx="400" cy="0" r="5" opacity="0.2">
        <animate attributeName="r" values="3; 7; 3" dur="2.3s" begin="1.1s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.1; 0.3; 0.1" dur="2.3s" begin="1.1s" repeatCount="indefinite" />
      </circle>
      <circle cx="400" cy="0" r="2"><animate attributeName="r" values="1.5; 3; 1.5" dur="2.3s" begin="1.1s" repeatCount="indefinite" /></circle>
    </g>

    <g>
